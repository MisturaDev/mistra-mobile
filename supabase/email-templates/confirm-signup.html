<div style="background: #111827; padding: 32px 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
  <div style="max-width: 480px; margin: 0 auto; background: #1F2937; border-radius: 16px; overflow: hidden; border: 1px solid #374151;">
    <div style="height: 4px; background: #7C3AED;"></div>

    <div style="padding: 32px 28px;">
      <p style="margin: 0 0 24px; color: #7C3AED; font-size: 13px; font-weight: 700; letter-spacing: 2px;">
        MISTRA
      </p>

      <h1 style="margin: 0 0 12px; color: #FFFFFF; font-size: 28px; font-weight: 700; line-height: 1.2;">
        Verify your email
      </h1>

      <p style="margin: 0 0 28px; color: #9CA3AF; font-size: 15px; line-height: 1.6;">
        Enter this 6-digit code in the app to finish creating your account.
      </p>

      <div style="background: #111827; border: 1px solid #374151; border-radius: 12px; padding: 24px; text-align: center; margin-bottom: 28px;">
        <p style="margin: 0 0 12px; color: #7C3AED; font-size: 11px; font-weight: 700; letter-spacing: 2px;">
          YOUR CODE
        </p>
        <p style="margin: 0; color: #FFFFFF; font-size: 36px; font-weight: 700; letter-spacing: 10px; font-family: monospace;">
          {{ .Token }}
        </p>
      </div>

      <p style="margin: 0; color: #6B7280; font-size: 13px; line-height: 1.6;">
        Code expires soon. If you did not create a Mistra account, you can ignore this email.
      </p>
    </div>
  </div>

  <p style="max-width: 480px; margin: 20px auto 0; color: #6B7280; font-size: 12px; text-align: center;">
    Mistra — Your life, organized.
  </p>
</div>
