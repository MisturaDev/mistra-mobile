<h2 style="color: #111827; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0 0 8px;">
  Reset your Mistra password
</h2>

<p style="color: #4B5563; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; line-height: 1.6;">
  We received a request to reset your password. Use this code to continue:
</p>

<p style="margin: 24px 0; text-align: center;">
  <span style="display: inline-block; background: #F5F3FF; color: #7C3AED; font-size: 32px; font-weight: 700; letter-spacing: 8px; padding: 16px 24px; border-radius: 12px; font-family: monospace;">
    {{ .Token }}
  </span>
</p>

<p style="color: #4B5563; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.6;">
  If you didn't request a password reset, you can safely ignore this email.
</p>

<p style="color: #9CA3AF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; margin-top: 32px;">
  Mistra — Your life, organized.
</p>
